<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Liked Songs Cache</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1ed760;
        }
        #status {
            color: #b3b3b3;
            font-size: 0.9em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            color: #b3b3b3;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
        tr:hover {
            background-color: #282828;
        }
        .album-art {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            vertical-align: middle;
            margin-right: 15px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Liked Songs</h1>
        <div>
            <button id="login-btn">Connect with Spotify</button>
            <button id="clear-cache-btn" class="hidden">Clear Cache & Logout</button>
        </div>
    </header>

    <div id="status">Please log in to fetch your songs.</div>

    <table id="songs-table" class="hidden">
        <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Album</th>
                <th>Date Added</th>
            </tr>
        </thead>
        <tbody id="songs-body">
            </tbody>
    </table>

    <script>
        // ==========================================
        // CONFIGURATION - UPDATE THESE VALUES
        // ==========================================
        const CLIENT_ID = 'YOUR_CLIENT_ID_HERE'; 
        const REDIRECT_URI = 'http://localhost:5500/index.html'; // Must match Spotify Dashboard exactly
        const SCOPES = 'user-library-read';
        
        const CACHE_KEY = 'spotify_liked_songs';
        let accessToken = null;

        // DOM Elements
        const loginBtn = document.getElementById('login-btn');
        const clearCacheBtn = document.getElementById('clear-cache-btn');
        const statusText = document.getElementById('status');
        const table = document.getElementById('songs-table');
        const tbody = document.getElementById('songs-body');

        // ==========================================
        // POPUP AUTHENTICATION HANDLING
        // ==========================================
        
        // 1. Check if this instance is the popup window returning from Spotify
        if (window.opener && window.location.hash) {
            // Send the hash containing the token back to the main window
            window.opener.postMessage(window.location.hash, '*');
            window.close();
        }

        // 2. Listen for the message from the popup
        window.addEventListener('message', (event) => {
            const hash = event.data;
            if (typeof hash === 'string' && hash.includes('access_token')) {
                const urlParams = new URLSearchParams(hash.replace('#', '?'));
                accessToken = urlParams.get('access_token');
                
                if (accessToken) {
                    loginBtn.classList.add('hidden');
                    clearCacheBtn.classList.remove('hidden');
                    initApp();
                }
            }
        });

        // 3. Trigger Popup
        loginBtn.addEventListener('click', () => {
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;
            
            // Calculate center position for the popup
            const width = 450;
            const height = 600;
            const left = (screen.width / 2) - (width / 2);
            const top = (screen.height / 2) - (height / 2);
            
            window.open(authUrl, 'Spotify Login', `width=${width},height=${height},top=${top},left=${left}`);
        });

        // ==========================================
        // CORE LOGIC & DATA FETCHING
        // ==========================================

        async function initApp() {
            // Check cache first
            const cachedSongs = localStorage.getItem(CACHE_KEY);
            
            if (cachedSongs) {
                statusText.innerText = "Loaded from cache.";
                renderTable(JSON.parse(cachedSongs));
            } else {
                statusText.innerText = "Fetching songs from Spotify... This might take a moment depending on your library size.";
                const songs = await fetchAllLikedSongs();
                if (songs.length > 0) {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(songs));
                    statusText.innerText = `Fetched ${songs.length} songs. Saved to cache.`;
                    renderTable(songs);
                }
            }
        }

        async function fetchAllLikedSongs() {
            let allSongs = [];
            let nextUrl = 'https://api.spotify.com/v1/me/tracks?limit=50'; // Max limit per request
            let count = 0;

            try {
                while (nextUrl) {
                    const response = await fetch(nextUrl, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });

                    if (!response.ok) throw new Error('Failed to fetch from Spotify');

                    const data = await response.json();
                    
                    // Map the complex Spotify object to a cleaner format for our cache
                    const formattedSongs = data.items.map(item => ({
                        id: item.track.id,
                        added_at: item.added_at,
                        name: item.track.name,
                        artist: item.track.artists.map(a => a.name).join(', '),
                        album: item.track.album.name,
                        image: item.track.album.images[2]?.url || '' // Get smallest image
                    }));

                    allSongs = allSongs.concat(formattedSongs);
                    nextUrl = data.next; // Spotify provides the exact URL for the next page
                    
                    count += formattedSongs.length;
                    statusText.innerText = `Fetching... (${count} retrieved)`;
                }
                return allSongs;
            } catch (error) {
                console.error(error);
                statusText.innerText = "Error fetching songs. Token may have expired.";
                return [];
            }
        }

        // ==========================================
        // UI RENDERING
        // ==========================================

        function renderTable(songs) {
            tbody.innerHTML = ''; // Clear existing
            
            songs.forEach((song, index) => {
                const dateAdded = new Date(song.added_at).toLocaleDateString();
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>
                        <img src="${song.image}" class="album-art" alt="Album art">
                        <div style="display:inline-block; vertical-align:middle;">
                            <div style="font-weight:bold; color:white;">${song.name}</div>
                            <div style="color:#b3b3b3; font-size:0.85em; margin-top:4px;">${song.artist}</div>
                        </div>
                    </td>
                    <td>${song.album}</td>
                    <td>${dateAdded}</td>
                `;
                tbody.appendChild(tr);
            });
            
            table.classList.remove('hidden');
        }

        clearCacheBtn.addEventListener('click', () => {
            localStorage.removeItem(CACHE_KEY);
            accessToken = null;
            tbody.innerHTML = '';
            table.classList.add('hidden');
            loginBtn.classList.remove('hidden');
            clearCacheBtn.classList.add('hidden');
            statusText.innerText = "Cache cleared. Please log in to fetch your songs.";
        });

        // Check if we already have a cache on page load without needing to log in again
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem(CACHE_KEY)) {
                loginBtn.classList.add('hidden');
                clearCacheBtn.classList.remove('hidden');
                initApp();
            }
        });
    </script>
</body>
</html>
