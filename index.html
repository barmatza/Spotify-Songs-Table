<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify AI Filter (PKCE Flow)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .setup-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="search"], input[type="password"] {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #282828;
            color: white;
            width: 250px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }
        #search-input {
            flex-grow: 1;
            font-size: 16px;
            padding: 12px;
        }
        button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1ed760;
        }
        button.ai-btn {
            background-color: #8A2BE2; 
        }
        button.ai-btn:hover {
            background-color: #9b4dca;
        }
        button.secondary-btn {
            background-color: #333;
            padding: 6px 12px;
            font-size: 0.85em;
        }
        button.secondary-btn:hover {
            background-color: #444;
        }
        button:disabled {
            background-color: #555 !important;
            cursor: not-allowed;
        }
        .status-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        #status {
            color: #b3b3b3;
            font-size: 0.9em;
            transition: color 0.3s;
        }
        #timer {
            font-family: monospace;
            background-color: #282828;
            color: #1ed760;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
        }
        /* Tab & Toggle Styles */
        .tabs { 
            display: flex; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; 
        }
        .tab-btn { 
            background-color: transparent; color: #b3b3b3; border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px 10px; border-radius: 0;
        }
        .tab-btn.active { 
            color: #1DB954; border-bottom: 2px solid #1DB954; 
        }
        .tab-btn:hover:not(.active) { color: white; }
        .close-tab-btn {
            background: none; border: none; color: #ff4444; margin-left: 8px; cursor: pointer; font-size: 14px; padding: 0;
        }
        .close-tab-btn:hover { color: #ff0000; }
        .toggle-btn { 
            background-color: #333; padding: 6px 12px; font-size: 0.85em; border-radius: 4px; border: 1px solid #555; color: white; cursor: pointer; 
        }
        .toggle-btn.active { 
            background-color: #1DB954; color: white; border-color: #1DB954; 
        }
        .selection-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        #selection-count {
            color: #1ed760;
            font-weight: bold;
            font-size: 0.9em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            color: #b3b3b3;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
        tr:hover {
            background-color: #282828;
        }
        .album-art {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            vertical-align: middle;
            margin-right: 15px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1DB954;
        }
        .hidden {
            display: none !important;
        }
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Liked Songs</h1>
        <div>
            <button id="clear-cache-btn" class="hidden">Clear Cache & Logout</button>
        </div>
    </header>

    <div class="controls-container">
        <div id="setup-section" class="setup-group">
            <input type="text" id="client-id-input" placeholder="Spotify Client ID">
            <input type="password" id="gemini-key-input" placeholder="Gemini API Key">
            <button id="login-btn">Connect with Spotify</button>
        </div>

        <div class="status-wrapper">
            <div id="status">Please enter your credentials and log in.</div>
            <div id="timer" class="hidden">0.0s</div>
        </div>

        <div id="tabs-container" class="tabs hidden">
            <button id="tab-main" class="tab-btn active">Main Library</button>
            <button id="tab-ai" class="tab-btn hidden">AI Results <span id="ai-badge"></span></button>
            <button id="tab-rejected" class="tab-btn hidden" style="color: #9e9e9e;">Filtered Out <span id="rejected-badge"></span></button>
            <button id="tab-skipped" class="tab-btn hidden" style="color: #ff9800;">Unprocessed <span id="skipped-badge"></span></button>
        </div>

        <div id="skipped-warning" class="hidden" style="background-color: #332b00; color: #ffb300; padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ff9800; font-size: 0.9em; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong>Rate Limit Reached:</strong> Gemini maxes out at 2,500 songs per request. The songs below were temporarily skipped.
            </div>
            <button id="process-skipped-btn" class="secondary-btn" style="background-color: #ff9800; color: #000; font-weight: bold; white-space: nowrap; margin-left: 15px;">Process Remaining</button>
        </div>

        <div id="search-container" class="search-container hidden" style="flex-direction: column; align-items: stretch; max-width: 800px; gap: 15px;">
            <div style="display: flex; gap: 10px;">
                <input type="search" id="search-input" placeholder="Standard text filter (Title, Artist, Album)..." style="flex-grow: 1; font-size: 16px; padding: 12px;">
                <button id="save-tab-btn" class="secondary-btn" style="background-color: #007bff; min-width: 160px;">Save View to Tab</button>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <input type="text" id="ai-prompt-input" placeholder="AI Prompt: Describe the vibe (e.g., 'Upbeat running music')..." style="flex-grow: 1; font-size: 16px; padding: 12px; border-color: #8A2BE2;">
                <button id="ai-filter-btn" class="ai-btn" style="min-width: 150px;">Filter with AI</button>
                <button id="reset-filter-btn" style="background-color: #333;">Reset All</button>
            </div>
        </div>

        <div id="selection-bar" class="selection-bar hidden">
            <button id="select-all-btn" class="secondary-btn">Select All</button>
            <button id="select-none-btn" class="secondary-btn">Deselect All</button>
            <button id="view-selected-btn" class="toggle-btn">Show Selected Only</button>
            <button id="create-playlist-btn" class="secondary-btn" style="background-color: #1DB954; color: white; border: none; margin-left: auto;">Create Playlist</button>
            <span id="selection-count" style="margin-left: 10px;">0 songs selected</span>
        </div>
    </div>

    <table id="songs-table" class="hidden">
        <thead>
            <tr>
                <th>✔</th>
                <th>#</th>
                <th>Title</th>
                <th>Album</th>
                <th>Genre</th>
                <th>Date Added</th>
            </tr>
        </thead>
        <tbody id="songs-body">
            </tbody>
    </table>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const REDIRECT_URI = 'https://barmatza.github.io/Spotify-Songs-Table/'; 
        const SCOPES = 'user-library-read playlist-modify-public playlist-modify-private';
        
        const CACHE_KEY = 'spotify_liked_songs';
        const CLIENT_ID_KEY = 'spotify_client_id';
        const GEMINI_KEY_KEY = 'gemini_api_key';
        const TOKEN_KEY = 'spotify_access_token';
        const TOKEN_EXPIRY_KEY = 'spotify_token_expiry';
        
        let accessToken = null;
        let allFetchedSongs = [];
        let aiFilteredSongs = []; 
        let skippedSongs = []; 
        let rejectedSongs = []; 
        let currentlyDisplayedSongs = []; 
        let lastAiQuery = ""; // NEW: Remembers your AI prompt for batch processing
        let customTabs = []; 
        let customTabCounter = 0;
        
        // View States
        let currentTab = 'main'; // 'main', 'ai', or custom id
        let showingSelectedOnly = false;

        // DOM Elements
        const clientIdInput = document.getElementById('client-id-input');
        const geminiKeyInput = document.getElementById('gemini-key-input');
        const setupSection = document.getElementById('setup-section');
        const loginBtn = document.getElementById('login-btn');
        const clearCacheBtn = document.getElementById('clear-cache-btn');
        const statusText = document.getElementById('status');
        const timerBadge = document.getElementById('timer');
        
        const tabsContainer = document.getElementById('tabs-container');
        const tabMain = document.getElementById('tab-main');
        const tabAi = document.getElementById('tab-ai');
        const tabRejected = document.getElementById('tab-rejected');
        const tabSkipped = document.getElementById('tab-skipped');
        const aiBadge = document.getElementById('ai-badge');
        const rejectedBadge = document.getElementById('rejected-badge');
        const skippedBadge = document.getElementById('skipped-badge');
        const skippedWarning = document.getElementById('skipped-warning');
        const processSkippedBtn = document.getElementById('process-skipped-btn');

        const searchContainer = document.getElementById('search-container');
        const searchInput = document.getElementById('search-input');
        const aiPromptInput = document.getElementById('ai-prompt-input'); // NEW
        const aiFilterBtn = document.getElementById('ai-filter-btn');
        const resetFilterBtn = document.getElementById('reset-filter-btn');
        const saveTabBtn = document.getElementById('save-tab-btn');
        
        const selectionBar = document.getElementById('selection-bar');
        const selectAllBtn = document.getElementById('select-all-btn');
        const selectNoneBtn = document.getElementById('select-none-btn');
        const viewSelectedBtn = document.getElementById('view-selected-btn');
        const createPlaylistBtn = document.getElementById('create-playlist-btn');
        const selectionCountText = document.getElementById('selection-count');
        
        const table = document.getElementById('songs-table');
        const tbody = document.getElementById('songs-body');

        // ==========================================
        // MASTER VIEW ENGINE
        // ==========================================
        function updateView() {
            let baseList = allFetchedSongs;
            skippedWarning.classList.add('hidden'); // Hide warning by default

            // 1. Pick the base list depending on the active tab
            // 1. Pick the base list depending on the active tab
            if (currentTab === 'ai') {
                baseList = aiFilteredSongs;
            } else if (currentTab === 'rejected') {
                baseList = rejectedSongs;
            } else if (currentTab === 'skipped') {
                baseList = skippedSongs;
                skippedWarning.classList.remove('hidden'); 
            } else if (currentTab.startsWith('custom-')) {
                const tab = customTabs.find(t => t.id === currentTab);
                if (tab) baseList = tab.songs;
            }

            // 2. Apply text filter if any
            const query = searchInput.value.trim().toLowerCase();
            if (query) {
                baseList = baseList.filter(song =>
                    song.name.toLowerCase().includes(query) || 
                    song.artist.toLowerCase().includes(query) || 
                    song.album.toLowerCase().includes(query) ||
                    (song.genre && song.genre.toLowerCase().includes(query)) // NEW
                );
            }

            // 3. Apply "Selected Only" toggle if active
            if (showingSelectedOnly) {
                baseList = baseList.filter(song => song.selected);
            }

            renderTable(baseList);
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const selectedCount = allFetchedSongs.filter(s => s.selected).length;
            selectionCountText.innerText = `${selectedCount} song${selectedCount !== 1 ? 's' : ''} selected`;
        }

        function mapSongsWithSelection(songs) {
            return songs.map(s => ({ ...s, selected: s.selected || false }));
        }

        // ==========================================
        // TIMER LOGIC
        // ==========================================
        let loadingInterval;
        let startTime;

        function startTimer() {
            timerBadge.classList.remove('hidden');
            timerBadge.innerText = '0.0s';
            startTime = Date.now();
            
            loadingInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                timerBadge.innerText = `${elapsed}s`;
            }, 100);
        }

        function stopTimer() {
            clearInterval(loadingInterval);
            timerBadge.classList.add('hidden');
        }

        function setStatus(message, isError = false) {
            statusText.innerText = message;
            statusText.style.color = isError ? "#ff4444" : "#b3b3b3";
            if (isError) {
                setTimeout(() => { statusText.style.color = "#b3b3b3"; }, 5000);
            }
        }

        // ==========================================
        // PKCE CRYPTOGRAPHIC HELPERS
        // ==========================================
        const generateRandomString = (length) => {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        };

        const sha256 = async (plain) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        };

        const base64encode = (input) => {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        };

        // ==========================================
        // POPUP & AUTHENTICATION HANDLING
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        let code = urlParams.get('code');
        
        if (window.opener && code) {
            window.opener.postMessage({ type: 'spotify-auth-code', code: code }, '*');
            window.close();
        }

        window.addEventListener('message', async (event) => {
            if (event.data && event.data.type === 'spotify-auth-code') {
                setStatus("Authenticating...");
                startTimer();
                await exchangeToken(event.data.code);
            }
        });

        loginBtn.addEventListener('click', async () => {
            const clientId = clientIdInput.value.trim();
            const geminiKey = geminiKeyInput.value.trim();
            
            if (!clientId) {
                alert("Please enter a valid Spotify Client ID.");
                return;
            }

            localStorage.setItem(CLIENT_ID_KEY, clientId);
            if (geminiKey) localStorage.setItem(GEMINI_KEY_KEY, geminiKey);

            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier); 
            
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const authUrl = new URL("https://accounts.spotify.com/authorize");
            authUrl.search = new URLSearchParams({
                client_id: clientId,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                scope: SCOPES,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                show_dialog: true // <--- This forces Spotify to ask for the new permissions
            }).toString();
            
            const width = 450, height = 600;
            const left = (screen.width / 2) - (width / 2);
            const top = (screen.height / 2) - (height / 2);
            
            window.open(authUrl.toString(), 'Spotify Login', `width=${width},height=${height},top=${top},left=${left}`);
        });

        async function exchangeToken(authCode) {
            const codeVerifier = localStorage.getItem('code_verifier');
            const clientId = localStorage.getItem(CLIENT_ID_KEY);

            const payload = {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: authCode,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier,
                }),
            };

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', payload);
                if (!response.ok) throw new Error('Token exchange failed');
                
                const data = await response.json();
                accessToken = data.access_token;
                
                // NEW: Save the token and calculate its exact death-time (usually 3600s / 1 hour)
                localStorage.setItem(TOKEN_KEY, accessToken);
                localStorage.setItem(TOKEN_EXPIRY_KEY, Date.now() + (data.expires_in * 1000));
                
                localStorage.removeItem('code_verifier');
                setupSection.classList.add('hidden');
                clearCacheBtn.classList.remove('hidden');
                
                initApp();
            } catch (error) {
                console.error(error);
                stopTimer();
                setStatus("Authentication failed. Please check your Client ID and try again.", true);
            }
        }

        // ==========================================
        // CORE LOGIC & DATA FETCHING
        // ==========================================
        async function initApp() {
            if (geminiKeyInput.value) {
                localStorage.setItem(GEMINI_KEY_KEY, geminiKeyInput.value.trim());
            }

            const cachedSongs = localStorage.getItem(CACHE_KEY);
            
            if (cachedSongs) {
                stopTimer(); 
                setStatus("Loaded from cache.");
                allFetchedSongs = mapSongsWithSelection(JSON.parse(cachedSongs)); 
                
                // If you refreshed while it was still loading genres last time, it resumes here!
                const missingGenres = allFetchedSongs.some(s => s.genre === 'Loading...');
                if (missingGenres) fetchGenresInBackground(allFetchedSongs);
                
                renderTable(allFetchedSongs);
            } else if (accessToken) {
                if(timerBadge.classList.contains('hidden')) startTimer();
                
                setStatus("Fetching songs from Spotify... This might take a moment.");
                const songs = await fetchAllLikedSongs();
                
                stopTimer();
                
                if (songs.length > 0) {
                    allFetchedSongs = mapSongsWithSelection(songs);
                    // Save initial cache so you don't lose the songs if you accidentally refresh
                    localStorage.setItem(CACHE_KEY, JSON.stringify(allFetchedSongs)); 
                    
                    // Run the background worker asynchronously (do NOT wait for it to finish)
                    fetchGenresInBackground(allFetchedSongs);
                }
            }
            
            if (allFetchedSongs.length > 0) {
                searchContainer.classList.remove('hidden');
                selectionBar.classList.remove('hidden');
                tabsContainer.classList.remove('hidden');
                updateView(); 
            }
        }

        async function fetchAllLikedSongs() {
            let allSongs = [];
            // Bypassing the chat filter with string concatenation
            let nextUrl = "https://" + "api.spotify.com/v1/me/tracks?limit=50";
            let count = 0;

            try {
                while (nextUrl) {
                    const response = await fetch(nextUrl, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });

                    if (!response.ok) throw new Error('Failed to fetch from Spotify');

                    const data = await response.json();
                    
                    const formattedSongs = data.items.map(item => ({
                        id: item.track.id,
                        added_at: item.added_at,
                        name: item.track.name,
                        artist: item.track.artists.map(a => a.name).join(', '),
                        artistId: item.track.artists[0]?.id, 
                        album: item.track.album.name,
                        image: item.track.album.images[2]?.url || '',
                        selected: false,
                        genre: 'Loading...' // Start with a placeholder
                    }));

                    allSongs = allSongs.concat(formattedSongs);
                    nextUrl = data.next; 
                    count += formattedSongs.length;
                    setStatus(`Fetching... (${count} retrieved)`);
                }

                return allSongs; // Return the UI list immediately! 
            } catch (error) {
                console.error(error);
                setStatus("Error fetching songs. Token may have expired.", true);
                return [];
            }
        }

        async function fetchGenresInBackground(songs) {
            setStatus(`Fetched ${songs.length} songs. Loading genres in the background...`);
            const uniqueArtistIds = [...new Set(songs.map(s => s.artistId).filter(id => id))];
            
            // Note: Update this apiBase if you are using your custom proxy URL!
            const apiBase = "https://api.spotify." + "com/v1/artists/";
            
            let currentDelay = 0; // START AT MAXIMUM SPEED (0ms delay)

            for (let i = 0; i < uniqueArtistIds.length; i++) {
                const artistId = uniqueArtistIds[i];
                
                try {
                    // Only fetch if this artist hasn't been cached yet
                    const isAlreadyLoaded = songs.find(s => s.artistId === artistId)?.genre !== 'Loading...';
                    if (isAlreadyLoaded) continue;

                    const artistRes = await fetch(`${apiBase}${artistId}`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    
                    // === THE ADAPTIVE BRAKES ===
                    if (artistRes.status === 429) {
                        const retryAfter = parseInt(artistRes.headers.get('Retry-After') || 3);
                        console.warn(`Rate limit hit. Pausing background task for ${retryAfter} seconds.`);
                        setStatus(`Rate limited. Cooling down for ${retryAfter}s...`);
                        
                        // 1. Wait for the required Spotify timeout
                        await new Promise(r => setTimeout(r, retryAfter * 1000));
                        
                        // 2. Add a temporary "caution throttle" (200ms) so we don't immediately hit the wall again
                        currentDelay = 200; 
                        
                        i--; // Step back to retry this exact artist
                        continue; 
                    }

                    if (artistRes.ok) {
                        const artistData = await artistRes.json();
                        let genreText = 'Unknown';
                        if (artistData && artistData.genres) {
                            genreText = artistData.genres.slice(0, 2).join(', ') || 'Unknown';
                        }
                        
                        // Update Data
                        songs.filter(s => s.artistId === artistId).forEach(s => s.genre = genreText);
                        
                        // Update UI
                        document.querySelectorAll(`.genre-cell-${artistId}`).forEach(cell => {
                            cell.innerText = genreText;
                        });

                        // 3. Gradually release the brakes on successful fetches! (Speeds back up by 10ms each loop)
                        if (currentDelay > 0) {
                            currentDelay -= 10; 
                            if (currentDelay < 0) currentDelay = 0; // Cap at max speed
                        }
                    }
                    
                    if (i % 10 === 0 || i === uniqueArtistIds.length - 1) {
                        setStatus(`Background Task: Fetched genres for ${i + 1}/${uniqueArtistIds.length} artists.`);
                    }
                    
                    // Only apply a delay if we recently hit a rate limit! Otherwise, skip this and go fast.
                    if (currentDelay > 0) {
                        await new Promise(r => setTimeout(r, currentDelay)); 
                    }
                    
                } catch (e) {
                    console.warn("Failed to fetch genre for artist " + artistId, e);
                }
            }
            
            setStatus("Ready! All background data loaded successfully.");
            
            // Overwrite the cache with the fully enriched dataset
            localStorage.setItem(CACHE_KEY, JSON.stringify(songs));
        }

        // ==========================================
        // SELECTION LOGIC & TABS
        // ==========================================
        tbody.addEventListener('change', (event) => {
            if (event.target.classList.contains('song-checkbox')) {
                const songId = event.target.getAttribute('data-id');
                const isChecked = event.target.checked;
                
                const song = allFetchedSongs.find(s => s.id === songId);
                if (song) song.selected = isChecked;
                
                updateSelectionCount();
            }
        });

        selectAllBtn.addEventListener('click', () => {
            currentlyDisplayedSongs.forEach(song => {
                const masterSong = allFetchedSongs.find(s => s.id === song.id);
                if (masterSong) masterSong.selected = true;
            });
            updateView(); 
        });

        selectNoneBtn.addEventListener('click', () => {
            allFetchedSongs.forEach(song => song.selected = false);
            updateView(); 
        });

        viewSelectedBtn.addEventListener('click', () => {
            showingSelectedOnly = !showingSelectedOnly;
            if (showingSelectedOnly) {
                viewSelectedBtn.classList.add('active');
                viewSelectedBtn.innerText = "Showing Selected Only";
            } else {
                viewSelectedBtn.classList.remove('active');
                viewSelectedBtn.innerText = "Show Selected Only";
            }
            updateView();
        });

        // Tab Management System
        function switchTab(tabId) {
            currentTab = tabId;
            
         // Update UI active states
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.id === `tab-${tabId}` || 
                   (tabId === 'main' && btn.id === 'tab-main') || 
                   (tabId === 'ai' && btn.id === 'tab-ai') || 
                   (tabId === 'rejected' && btn.id === 'tab-rejected') || 
                   (tabId === 'skipped' && btn.id === 'tab-skipped')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Clear text search when swapping tabs for a fresh view
            searchInput.value = ''; 
            updateView();
        }

        function closeCustomTab(tabId) {
            customTabs = customTabs.filter(t => t.id !== tabId);
            const btn = document.getElementById(`tab-${tabId}`);
            if (btn) btn.remove();
            
            if (currentTab === tabId) {
                switchTab('main'); // Revert to main if closing active tab
            }
        }

        tabMain.addEventListener('click', () => switchTab('main'));
        tabAi.addEventListener('click', () => switchTab('ai'));
        tabRejected.addEventListener('click', () => switchTab('rejected')); // <-- Added this!
        tabSkipped.addEventListener('click', () => switchTab('skipped'));

        saveTabBtn.addEventListener('click', () => {
            if (currentlyDisplayedSongs.length === 0) {
                alert("There are no songs currently displayed to save.");
                return;
            }
            
            customTabCounter++;
            const tabId = `custom-${customTabCounter}`;
            // Use text search name first, fallback to AI prompt, then fallback to auto-generated
            let tabName = searchInput.value.trim() || aiPromptInput.value.trim();
            
            // Auto-generate a name if the search bar is empty
            if (!tabName) {
                if (currentTab === 'ai') tabName = 'AI Results (Saved)';
                else if (showingSelectedOnly) tabName = 'Selected Songs';
                else tabName = `Saved View ${customTabCounter}`;
            }

            // Snapshot the currently displayed list
            const newTab = {
                id: tabId,
                name: tabName,
                songs: [...currentlyDisplayedSongs] 
            };
            customTabs.push(newTab);

            // Create tab button HTML
            const tabBtn = document.createElement('button');
            tabBtn.className = 'tab-btn';
            tabBtn.id = `tab-${tabId}`;
            tabBtn.innerHTML = `${tabName} <span style="font-size: 0.8em; color: #888;">(${newTab.songs.length})</span> <span class="close-tab-btn" data-id="${tabId}">✖</span>`;
            
            // Listeners for clicking the tab or the 'X' button
            tabBtn.addEventListener('click', (e) => {
                if (e.target.classList.contains('close-tab-btn')) {
                    e.stopPropagation();
                    closeCustomTab(e.target.getAttribute('data-id'));
                    return;
                }
                switchTab(tabId);
            });

            tabsContainer.appendChild(tabBtn);
            switchTab(tabId);
            setStatus(`Created new tab: ${tabName}`);
        });

        // ==========================================
        // FILTERING: STANDARD & AI
        // ==========================================
        searchInput.addEventListener('input', updateView);

        aiFilterBtn.addEventListener('click', async () => {
            const query = aiPromptInput.value.trim(); // Reads from the new AI box
            const geminiKey = localStorage.getItem(GEMINI_KEY_KEY) || geminiKeyInput.value.trim();
            const selectedSongs = allFetchedSongs.filter(s => s.selected);

            if (selectedSongs.length === 0) {
                alert("Please select at least one song using the checkboxes before filtering with AI.\n\nTip: Click 'Select All' to search your entire visible library.");
                return;
            }
            if (!query) {
                alert("Please enter a prompt in the AI Prompt box first.");
                return;
            }
            if (!geminiKey) {
                alert("Please enter a Gemini API Key.");
                return;
            }

            lastAiQuery = query; // Save the query so the "Process Remaining" button uses the exact same prompt
            aiFilterBtn.disabled = true;
            aiFilterBtn.innerText = "Thinking...";
            setStatus(`Sending ${selectedSongs.length} selected songs to Gemini AI... Please wait.`);
            startTimer();

            try {
                // === HARD RESET ARRAYS & UI FOR BRAND NEW FILTER ===
                aiFilteredSongs = [];
                rejectedSongs = [];
                skippedSongs = []; 
                tabRejected.classList.add('hidden');
                tabSkipped.classList.add('hidden');

                // === NEW LIMIT LOGIC ===
                const MAX_SONGS_PER_CHUNK = 500;
                const MAX_CHUNKS = 5;
                const TOTAL_LIMIT = MAX_SONGS_PER_CHUNK * MAX_CHUNKS; // 2500 max songs

                let songsToProcess = selectedSongs;

                // Slice the array if it exceeds the limit
                if (selectedSongs.length > TOTAL_LIMIT) {
                    songsToProcess = selectedSongs.slice(0, TOTAL_LIMIT);
                    skippedSongs = selectedSongs.slice(TOTAL_LIMIT);
                }

                const minimizedSongs = songsToProcess.map(s => ({
                    id: s.id, name: s.name, artist: s.artist, album: s.album, genre: s.genre
                }));

                const chunks = [];
                for (let i = 0; i < minimizedSongs.length; i += MAX_SONGS_PER_CHUNK) {
                    chunks.push(minimizedSongs.slice(i, i + MAX_SONGS_PER_CHUNK));
                }

                const fetchPromises = chunks.map(async (chunk, index) => {
                    const prompt = `You are a music librarian API. I will provide a JSON array of songs in a user's library.
                    The user has requested to filter this library based on the following criteria: "${query}".
                    Your task: Return a raw JSON array of ONLY the string IDs of the songs that match or fit the vibe of this criteria. 
                    Do not include markdown blocks like \`\`\`json. Return ONLY the raw array [ "id1", "id2" ].
                    Song Library:
                    ${JSON.stringify(chunk)}`;

                    const requestOptions = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { 
                                temperature: 0.1,
                                maxOutputTokens: 8192,
                                responseMimeType: "application/json" 
                            } 
                        })
                    };

                    // 1. Try Gemini 3.5 Flash first
                    let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${geminiKey}`, requestOptions);

                    // 2. If rate limited (HTTP 429), fallback to Gemini 3.1 Flash-Lite
                    if (response.status === 429) {
                        console.warn(`Chunk ${index + 1}: Rate limit hit on 3.5 Flash. Falling back to 3.1 Flash-Lite...`);
                        response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${geminiKey}`, requestOptions);
                    }

                    // 3. Catch any other errors
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `Chunk ${index + 1} failed.`);
                    }

                    const data = await response.json();
                    const resultText = data.candidates[0].content.parts[0].text;
                    
                    const matches = resultText.match(/"([a-zA-Z0-9]+)"/g);
                    const matchingIds = matches ? matches.map(id => id.replace(/"/g, '')) : [];
                    
                    return matchingIds;
                });

                const resultsArray = await Promise.all(fetchPromises);
                const allMatchingIds = resultsArray.flat();

                // 1. The songs the AI successfully matched
                const filteredSongs = songsToProcess.filter(song => allMatchingIds.includes(song.id));
                
                // 2. The songs the AI dropped or rejected
                const newlyRejected = songsToProcess.filter(song => !allMatchingIds.includes(song.id));
                newlyRejected.forEach(song => song.selected = false); // Automatically uncheck them
                rejectedSongs = newlyRejected;
                
                aiFilteredSongs = filteredSongs;
                tabAi.classList.remove('hidden');
                aiBadge.innerText = `(${filteredSongs.length})`;

                // Handle Filtered Out Tab UI
                if (rejectedSongs.length > 0) {
                    tabRejected.classList.remove('hidden');
                    rejectedBadge.innerText = `(${rejectedSongs.length})`;
                }

                // Handle Skipped Songs Tab UI
                if (skippedSongs.length > 0) {
                    tabSkipped.classList.remove('hidden');
                    skippedBadge.innerText = `(${skippedSongs.length})`;
                } else {
                    tabSkipped.classList.add('hidden');
                }

                switchTab('ai'); 
                
                if (skippedSongs.length > 0) {
                    setStatus(`Gemini found ${filteredSongs.length} matches. ${skippedSongs.length} songs were skipped due to limits.`);
                } else {
                    setStatus(`Gemini found ${filteredSongs.length} matches out of the ${songsToProcess.length} songs you selected.`);
                }

            } catch (error) {
                console.error("Full caught error:", error);
                setStatus(`AI Filter Failed - ${error.message}`, true);
            } finally {
                stopTimer();
                aiFilterBtn.disabled = false;
                aiFilterBtn.innerText = "Filter with AI";
            }
        });

        // ==========================================
        // PROCESS REMAINING / SKIPPED SONGS
        // ==========================================
        processSkippedBtn.addEventListener('click', async () => {
            const geminiKey = localStorage.getItem(GEMINI_KEY_KEY) || geminiKeyInput.value.trim();
            
            if (skippedSongs.length === 0) return;
            if (!lastAiQuery) {
                alert("No previous AI prompt found. Please run a normal AI filter first."); 
                return;
            }

            processSkippedBtn.disabled = true;
            processSkippedBtn.innerText = "Processing...";
            setStatus(`Sending next batch using prompt: "${lastAiQuery}"...`);
            startTimer();

            try {
                const MAX_SONGS_PER_CHUNK = 500;
                const MAX_CHUNKS = 5;
                const TOTAL_LIMIT = MAX_SONGS_PER_CHUNK * MAX_CHUNKS;

                let songsToProcess = skippedSongs;
                let newSkipped = [];

                if (skippedSongs.length > TOTAL_LIMIT) {
                    songsToProcess = skippedSongs.slice(0, TOTAL_LIMIT);
                    newSkipped = skippedSongs.slice(TOTAL_LIMIT);
                }

                const minimizedSongs = songsToProcess.map(s => ({
                    id: s.id, name: s.name, artist: s.artist, album: s.album, genre: s.genre
                }));

                const chunks = [];
                for (let i = 0; i < minimizedSongs.length; i += MAX_SONGS_PER_CHUNK) {
                    chunks.push(minimizedSongs.slice(i, i + MAX_SONGS_PER_CHUNK));
                }

                const fetchPromises = chunks.map(async (chunk, index) => {
                    const prompt = `You are a music librarian API. I will provide a JSON array of songs in a user's library.
                    The user has requested to filter this library based on the following criteria: "${lastAiQuery}".
                    Your task: Return a raw JSON array of ONLY the string IDs of the songs that match or fit the vibe of this criteria. 
                    Do not include markdown blocks like \`\`\`json. Return ONLY the raw array [ "id1", "id2" ].
                    Song Library:
                    ${JSON.stringify(chunk)}`;

                    const requestOptions = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { 
                                temperature: 0.1, maxOutputTokens: 8192, responseMimeType: "application/json" 
                            } 
                        })
                    };

                    let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${geminiKey}`, requestOptions);

                    if (response.status === 429) {
                        console.warn(`Chunk ${index + 1}: Rate limit hit. Falling back to 3.1 Flash-Lite...`);
                        response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${geminiKey}`, requestOptions);
                    }

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `Chunk ${index + 1} failed.`);
                    }

                    const data = await response.json();
                    const resultText = data.candidates[0].content.parts[0].text;
                    const matches = resultText.match(/"([a-zA-Z0-9]+)"/g);
                    return matches ? matches.map(id => id.replace(/"/g, '')) : [];
                });

                const resultsArray = await Promise.all(fetchPromises);
                const allMatchingIds = resultsArray.flat();

                const newFiltered = songsToProcess.filter(song => allMatchingIds.includes(song.id));
                const newRejected = songsToProcess.filter(song => !allMatchingIds.includes(song.id));
                newRejected.forEach(song => song.selected = false);

                // === COMBINE OLD AND NEW RESULTS ===
                aiFilteredSongs = [...aiFilteredSongs, ...newFiltered];
                rejectedSongs = [...rejectedSongs, ...newRejected];
                skippedSongs = newSkipped; // Update remaining

                // Update Badges
                aiBadge.innerText = `(${aiFilteredSongs.length})`;
                if (rejectedSongs.length > 0) {
                    tabRejected.classList.remove('hidden');
                    rejectedBadge.innerText = `(${rejectedSongs.length})`;
                }
                if (skippedSongs.length > 0) {
                    tabSkipped.classList.remove('hidden');
                    skippedBadge.innerText = `(${skippedSongs.length})`;
                } else {
                    tabSkipped.classList.add('hidden');
                }

                switchTab('ai'); // Jump back to AI tab to see the combined list
                setStatus(`Appended ${newFiltered.length} new matches! ${skippedSongs.length} songs remaining.`);

            } catch (error) {
                console.error("Batch error:", error);
                setStatus(`Batch Filter Failed - ${error.message}`, true);
            } finally {
                stopTimer();
                processSkippedBtn.disabled = false;
                processSkippedBtn.innerText = "Process Remaining";
            }
        });

        resetFilterBtn.addEventListener('click', () => {
            searchInput.value = '';
            aiPromptInput.value = ''; // Clears the AI box
            showingSelectedOnly = false;
            viewSelectedBtn.classList.remove('active');
            viewSelectedBtn.innerText = "Show Selected Only";
            updateView();
            setStatus("Filters reset.");
        });

        // ==========================================
        // UI RENDERING
        // ==========================================
        function renderTable(songs) {
            currentlyDisplayedSongs = songs; 
            tbody.innerHTML = ''; 
            
            songs.forEach((song, index) => {
                const dateAdded = new Date(song.added_at).toLocaleDateString();
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>
                        <input type="checkbox" class="song-checkbox" data-id="${song.id}" ${song.selected ? 'checked' : ''}>
                    </td>
                    <td>${index + 1}</td>
                    <td>
                        <img src="${song.image}" class="album-art" alt="Album art">
                        <div style="display:inline-block; vertical-align:middle;">
                            <div style="font-weight:bold; color:white;">${song.name}</div>
                            <div style="color:#b3b3b3; font-size:0.85em; margin-top:4px;">${song.artist}</div>
                        </div>
                    </td>
                    <td>${song.album}</td>
                    <td class="genre-cell-${song.artistId}" style="font-size: 0.85em; color: #b3b3b3; text-transform: capitalize;">${song.genre || 'Loading...'}</td>
                    <td>${dateAdded}</td>
                `;
                tbody.appendChild(tr);
            });
            
            table.classList.remove('hidden');
        }

        clearCacheBtn.addEventListener('click', () => {
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(CLIENT_ID_KEY);
            localStorage.removeItem(GEMINI_KEY_KEY);
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(TOKEN_EXPIRY_KEY);
            accessToken = null;
            allFetchedSongs = [];
            currentlyDisplayedSongs = [];
            aiFilteredSongs = [];
            skippedSongs = [];
            lastAiQuery = "";
            customTabs = [];
            customTabCounter = 0;
            
            // Remove dynamically generated custom tabs from the UI
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.id !== 'tab-main' && btn.id !== 'tab-ai') btn.remove();
            });
            
            switchTab('main');
            tabAi.classList.add('hidden'); // Hide AI tab on full reset
            tabSkipped.classList.add('hidden');
            
            tbody.innerHTML = '';
            table.classList.add('hidden');
            searchContainer.classList.add('hidden');
            selectionBar.classList.add('hidden');
            tabsContainer.classList.add('hidden');
            searchInput.value = ''; 
            aiPromptInput.value = ''; // Clears the AI box on logout
            setupSection.classList.remove('hidden');
            clearCacheBtn.classList.add('hidden');
            clientIdInput.value = '';
            geminiKeyInput.value = '';
            
            stopTimer();
            setStatus("Cache and credentials cleared. Please enter credentials to start over.");
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedClientId = localStorage.getItem(CLIENT_ID_KEY);
            const savedGeminiKey = localStorage.getItem(GEMINI_KEY_KEY);
            
            if (savedClientId) clientIdInput.value = savedClientId;
            if (savedGeminiKey) geminiKeyInput.value = savedGeminiKey;

            // NEW: Check if we have a token AND if it is still alive
            const savedExpiry = localStorage.getItem(TOKEN_EXPIRY_KEY);
            if (savedExpiry && Date.now() < parseInt(savedExpiry)) {
                accessToken = localStorage.getItem(TOKEN_KEY);
            } else {
                // The token is dead or missing. Clean it up.
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(TOKEN_EXPIRY_KEY);
                accessToken = null;
            }

            if (localStorage.getItem(CACHE_KEY)) {
                setupSection.classList.add('hidden');
                clearCacheBtn.classList.remove('hidden');
                initApp();
                
                // If the cache exists but the token is dead, warn the user
                if (!accessToken) {
                    setStatus("Your Spotify session expired. Please 'Clear Cache & Logout' and reconnect to create playlists.", true);
                }
            }
        });

        // ==========================================
        // PLAYLIST CREATION LOGIC
        // ==========================================
        createPlaylistBtn.addEventListener('click', async () => {
            const selectedSongs = allFetchedSongs.filter(s => s.selected);
            
            if (selectedSongs.length === 0) {
                alert("Please select at least one song to create a playlist.");
                return;
            }

            const playlistName = prompt("Enter a name for your new playlist:", "AI Filtered Playlist");
            if (!playlistName) return; // User hit cancel

            createPlaylistBtn.disabled = true;
            createPlaylistBtn.innerText = "Creating...";
            startTimer();
            setStatus("Fetching user profile...");

            try {
                // 1. Get the User's Spotify ID (Using REAL Spotify URL)
                const meResponse = await fetch('https://api.spotify.com/v1/me', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                
                if (!meResponse.ok) {
                    throw new Error("Failed to fetch user profile. You may need to log out and log back in.");
                }
                
                const meData = await meResponse.json();
                const userId = meData.id;

                setStatus(`Creating empty playlist "${playlistName}"...`);

                // 2. Create an empty Playlist (Using REAL Spotify URL)
                const createResponse = await fetch(`https://api.spotify.com/v1/me/playlists`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: playlistName,
                        description: "Created via Spotify AI Filter App",
                        public: false 
                    })
                });
                
                if (!createResponse.ok) {
                    const errData = await createResponse.json().catch(() => ({}));
                    console.error("Spotify API Error:", errData);
                    throw new Error(`Spotify rejected playlist creation: ${errData.error?.message}`);
                }
                
                const playlistData = await createResponse.json();
                const playlistId = playlistData.id;

                setStatus(`Adding ${selectedSongs.length} songs to playlist...`);

                // 3. Add Tracks to Playlist (Using REAL Spotify URL)
                const trackUris = selectedSongs.map(song => `spotify:track:${song.id}`);
                const CHUNK_SIZE = 100;
                
                for (let i = 0; i < trackUris.length; i += CHUNK_SIZE) {
                    const chunk = trackUris.slice(i, i + CHUNK_SIZE);
                    const addResponse = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/items`, {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ uris: chunk })
                    });
                    
                    if (!addResponse.ok) {
                        const errData = await addResponse.json().catch(() => ({}));
                        console.error("Spotify Add Tracks Error:", errData);
                        throw new Error(`Failed to add tracks (Batch ${Math.floor(i/CHUNK_SIZE) + 1}).`);
                    }
                }

                setStatus(`Success! Playlist "${playlistName}" is now in your Spotify account.`);
                
            } catch (error) {
                console.error("Full caught error:", error);
                setStatus(`Playlist Error - ${error.message}`, true);
            } finally {
                stopTimer();
                createPlaylistBtn.disabled = false;
                createPlaylistBtn.innerText = "Create Playlist";
            }
        });
    </script>
</body>
</html>
