<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Liked Songs (PKCE Flow)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .setup-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        input[type="text"], input[type="search"] {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #282828;
            color: white;
            width: 300px;
        }
        /* Make the search bar a bit wider and distinct */
        #search-input {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            font-size: 16px;
            padding: 12px;
        }
        button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1ed760;
        }
        #status {
            color: #b3b3b3;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            color: #b3b3b3;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
        tr:hover {
            background-color: #282828;
        }
        .album-art {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            vertical-align: middle;
            margin-right: 15px;
        }
        .hidden {
            display: none !important;
        }
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Liked Songs</h1>
        <div>
            <button id="clear-cache-btn" class="hidden">Clear Cache & Logout</button>
        </div>
    </header>

    <div class="controls-container">
        <div id="setup-section" class="setup-group">
            <input type="text" id="client-id-input" placeholder="Paste your Spotify Client ID here">
            <button id="login-btn">Connect with Spotify</button>
        </div>

        <div id="status">Please enter your Client ID and log in to fetch your songs.</div>

        <input type="search" id="search-input" class="hidden" placeholder="Filter by title, artist, or album...">
    </div>

    <table id="songs-table" class="hidden">
        <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Album</th>
                <th>Date Added</th>
            </tr>
        </thead>
        <tbody id="songs-body">
            </tbody>
    </table>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const REDIRECT_URI = 'https://barmatza.github.io/Spotify-Songs-Table/'; 
        const SCOPES = 'user-library-read';
        const CACHE_KEY = 'spotify_liked_songs';
        const CLIENT_ID_KEY = 'spotify_client_id';
        
        let accessToken = null;
        let allFetchedSongs = []; // Store songs in memory for fast filtering

        // DOM Elements
        const clientIdInput = document.getElementById('client-id-input');
        const setupSection = document.getElementById('setup-section');
        const loginBtn = document.getElementById('login-btn');
        const clearCacheBtn = document.getElementById('clear-cache-btn');
        const statusText = document.getElementById('status');
        const searchInput = document.getElementById('search-input');
        const table = document.getElementById('songs-table');
        const tbody = document.getElementById('songs-body');

        // ==========================================
        // PKCE CRYPTOGRAPHIC HELPERS
        // ==========================================
        
        const generateRandomString = (length) => {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        };

        const sha256 = async (plain) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        };

        const base64encode = (input) => {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        };

        // ==========================================
        // POPUP & AUTHENTICATION HANDLING
        // ==========================================
        
        const urlParams = new URLSearchParams(window.location.search);
        let code = urlParams.get('code');
        
        if (window.opener && code) {
            window.opener.postMessage({ type: 'spotify-auth-code', code: code }, '*');
            window.close();
        }

        window.addEventListener('message', async (event) => {
            if (event.data && event.data.type === 'spotify-auth-code') {
                statusText.innerText = "Authenticating...";
                await exchangeToken(event.data.code);
            }
        });

        loginBtn.addEventListener('click', async () => {
            const clientId = clientIdInput.value.trim();
            
            if (!clientId) {
                alert("Please enter a valid Client ID.");
                return;
            }

            localStorage.setItem(CLIENT_ID_KEY, clientId);

            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier); 
            
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const authUrl = new URL("https://accounts.spotify.com/authorize");
            authUrl.search = new URLSearchParams({
                client_id: clientId,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                scope: SCOPES,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
            }).toString();
            
            const width = 450, height = 600;
            const left = (screen.width / 2) - (width / 2);
            const top = (screen.height / 2) - (height / 2);
            
            window.open(authUrl.toString(), 'Spotify Login', `width=${width},height=${height},top=${top},left=${left}`);
        });

        async function exchangeToken(authCode) {
            const codeVerifier = localStorage.getItem('code_verifier');
            const clientId = localStorage.getItem(CLIENT_ID_KEY);

            const payload = {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: authCode,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier,
                }),
            };

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', payload);
                if (!response.ok) throw new Error('Token exchange failed');
                
                const data = await response.json();
                accessToken = data.access_token;
                
                localStorage.removeItem('code_verifier');
                setupSection.classList.add('hidden');
                clearCacheBtn.classList.remove('hidden');
                initApp();
            } catch (error) {
                console.error(error);
                statusText.innerText = "Authentication failed. Please check your Client ID and try again.";
            }
        }

        // ==========================================
        // CORE LOGIC & DATA FETCHING
        // ==========================================

        async function initApp() {
            const cachedSongs = localStorage.getItem(CACHE_KEY);
            
            if (cachedSongs) {
                statusText.innerText = "Loaded from cache.";
                allFetchedSongs = JSON.parse(cachedSongs); // Store in global memory
                renderTable(allFetchedSongs);
            } else if (accessToken) {
                statusText.innerText = "Fetching songs from Spotify... This might take a moment.";
                const songs = await fetchAllLikedSongs();
                if (songs.length > 0) {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(songs));
                    statusText.innerText = `Fetched ${songs.length} songs. Saved to cache.`;
                    allFetchedSongs = songs; // Store in global memory
                    renderTable(allFetchedSongs);
                }
            }
            
            // Show the search bar if we have songs
            if (allFetchedSongs.length > 0) {
                searchInput.classList.remove('hidden');
            }
        }

        async function fetchAllLikedSongs() {
            let allSongs = [];
            let nextUrl = 'https://api.spotify.com/v1/me/tracks?limit=50'; 
            let count = 0;

            try {
                while (nextUrl) {
                    const response = await fetch(nextUrl, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });

                    if (!response.ok) throw new Error('Failed to fetch from Spotify');

                    const data = await response.json();
                    
                    const formattedSongs = data.items.map(item => ({
                        id: item.track.id,
                        added_at: item.added_at,
                        name: item.track.name,
                        artist: item.track.artists.map(a => a.name).join(', '),
                        album: item.track.album.name,
                        image: item.track.album.images[2]?.url || '' 
                    }));

                    allSongs = allSongs.concat(formattedSongs);
                    nextUrl = data.next; 
                    count += formattedSongs.length;
                    statusText.innerText = `Fetching... (${count} retrieved)`;
                }
                return allSongs;
            } catch (error) {
                console.error(error);
                statusText.innerText = "Error fetching songs. Token may have expired.";
                return [];
            }
        }

        // ==========================================
        // FILTERING LOGIC
        // ==========================================

        searchInput.addEventListener('input', (event) => {
            const query = event.target.value.toLowerCase();
            
            // Filter the master list in memory
            const filteredSongs = allFetchedSongs.filter(song => {
                return song.name.toLowerCase().includes(query) || 
                       song.artist.toLowerCase().includes(query) || 
                       song.album.toLowerCase().includes(query);
            });
            
            // Re-render the table with the filtered results
            renderTable(filteredSongs);
        });

        // ==========================================
        // UI RENDERING & INITIALIZATION
        // ==========================================

        function renderTable(songs) {
            tbody.innerHTML = ''; 
            
            songs.forEach((song, index) => {
                const dateAdded = new Date(song.added_at).toLocaleDateString();
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>
                        <img src="${song.image}" class="album-art" alt="Album art">
                        <div style="display:inline-block; vertical-align:middle;">
                            <div style="font-weight:bold; color:white;">${song.name}</div>
                            <div style="color:#b3b3b3; font-size:0.85em; margin-top:4px;">${song.artist}</div>
                        </div>
                    </td>
                    <td>${song.album}</td>
                    <td>${dateAdded}</td>
                `;
                tbody.appendChild(tr);
            });
            
            table.classList.remove('hidden');
        }

        clearCacheBtn.addEventListener('click', () => {
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(CLIENT_ID_KEY);
            accessToken = null;
            allFetchedSongs = [];
            
            tbody.innerHTML = '';
            table.classList.add('hidden');
            searchInput.classList.add('hidden');
            searchInput.value = ''; // Reset search text
            setupSection.classList.remove('hidden');
            clearCacheBtn.classList.add('hidden');
            clientIdInput.value = '';
            
            statusText.innerText = "Cache and credentials cleared. Please enter a Client ID to start over.";
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedClientId = localStorage.getItem(CLIENT_ID_KEY);
            if (savedClientId) {
                clientIdInput.value = savedClientId;
            }

            if (localStorage.getItem(CACHE_KEY)) {
                setupSection.classList.add('hidden');
                clearCacheBtn.classList.remove('hidden');
                initApp();
            }
        });
    </script>
</body>
</html>
