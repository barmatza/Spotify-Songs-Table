<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify AI Filter (PKCE Flow)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .setup-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="search"], input[type="password"] {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #282828;
            color: white;
            width: 250px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }
        #search-input {
            flex-grow: 1;
            font-size: 16px;
            padding: 12px;
        }
        button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1ed760;
        }
        button.ai-btn {
            background-color: #8A2BE2; 
        }
        button.ai-btn:hover {
            background-color: #9b4dca;
        }
        button.secondary-btn {
            background-color: #333;
            padding: 6px 12px;
            font-size: 0.85em;
        }
        button.secondary-btn:hover {
            background-color: #444;
        }
        button:disabled {
            background-color: #555 !important;
            cursor: not-allowed;
        }
        .status-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        #status {
            color: #b3b3b3;
            font-size: 0.9em;
            transition: color 0.3s;
        }
        #timer {
            font-family: monospace;
            background-color: #282828;
            color: #1ed760;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
        }
        /* Tab & Toggle Styles */
        .tabs { 
            display: flex; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; 
        }
        .tab-btn { 
            background-color: transparent; color: #b3b3b3; border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px 10px; border-radius: 0;
        }
        .tab-btn.active { 
            color: #1DB954; border-bottom: 2px solid #1DB954; 
        }
        .tab-btn:hover:not(.active) { color: white; }
        .close-tab-btn {
            background: none; border: none; color: #ff4444; margin-left: 8px; cursor: pointer; font-size: 14px; padding: 0;
        }
        .close-tab-btn:hover { color: #ff0000; }
        .toggle-btn { 
            background-color: #333; padding: 6px 12px; font-size: 0.85em; border-radius: 4px; border: 1px solid #555; color: white; cursor: pointer; 
        }
        .toggle-btn.active { 
            background-color: #1DB954; color: white; border-color: #1DB954; 
        }
        .selection-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        #selection-count {
            color: #1ed760;
            font-weight: bold;
            font-size: 0.9em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            color: #b3b3b3;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
        tr:hover {
            background-color: #282828;
        }
        .album-art {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            vertical-align: middle;
            margin-right: 15px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1DB954;
        }
        .hidden {
            display: none !important;
        }
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Liked Songs</h1>
        <div>
            <button id="clear-cache-btn" class="hidden">Clear Cache & Logout</button>
        </div>
    </header>

    <div class="controls-container">
        <div id="setup-section" class="setup-group">
            <input type="text" id="client-id-input" placeholder="Spotify Client ID">
            <input type="password" id="gemini-key-input" placeholder="Gemini API Key">
            <button id="login-btn">Connect with Spotify</button>
        </div>

        <div class="status-wrapper">
            <div id="status">Please enter your credentials and log in.</div>
            <div id="timer" class="hidden">0.0s</div>
        </div>

        <div id="tabs-container" class="tabs hidden">
            <button id="tab-main" class="tab-btn active">Main Library</button>
            <button id="tab-ai" class="tab-btn hidden">AI Results <span id="ai-badge"></span></button>
            <button id="tab-skipped" class="tab-btn hidden" style="color: #ff9800;">Unprocessed <span id="skipped-badge"></span></button>
        </div>

        <div id="skipped-warning" class="hidden" style="background-color: #332b00; color: #ffb300; padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ff9800; font-size: 0.9em;">
            <strong>Rate Limit Reached:</strong> Gemini can only process a maximum of 2,500 songs per request (5 batches of 500). The songs below were excluded from the AI filter.
        </div>

        <div id="search-container" class="search-container hidden" style="flex-wrap: wrap; max-width: 800px;">
            <input type="search" id="search-input" placeholder="Standard text filter or AI prompt...">
            <button id="ai-filter-btn" class="ai-btn">Filter with AI</button>
            <button id="reset-filter-btn" style="background-color: #333;">Reset Filters</button>
            <button id="save-tab-btn" class="secondary-btn" style="background-color: #007bff;">Save View to New Tab</button>
        </div>

        <div id="selection-bar" class="selection-bar hidden">
            <button id="select-all-btn" class="secondary-btn">Select All</button>
            <button id="select-none-btn" class="secondary-btn">Deselect All</button>
            <button id="view-selected-btn" class="toggle-btn">Show Selected Only</button>
            <span id="selection-count">0 songs selected</span>
        </div>
    </div>

    <table id="songs-table" class="hidden">
        <thead>
            <tr>
                <th>✔</th>
                <th>#</th>
                <th>Title</th>
                <th>Album</th>
                <th>Date Added</th>
            </tr>
        </thead>
        <tbody id="songs-body">
            </tbody>
    </table>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const REDIRECT_URI = 'https://barmatza.github.io/Spotify-Songs-Table/'; 
        const SCOPES = 'user-library-read';
        
        const CACHE_KEY = 'spotify_liked_songs';
        const CLIENT_ID_KEY = 'spotify_client_id';
        const GEMINI_KEY_KEY = 'gemini_api_key';
        
        let accessToken = null;
        let allFetchedSongs = []; 
        let aiFilteredSongs = []; 
        let skippedSongs = []; // NEW: Stores songs that exceeded the limit
        let currentlyDisplayedSongs = []; 
        let customTabs = []; 
        let customTabCounter = 0;
        
        // View States
        let currentTab = 'main'; // 'main', 'ai', or custom id
        let showingSelectedOnly = false;

        // DOM Elements
        const clientIdInput = document.getElementById('client-id-input');
        const geminiKeyInput = document.getElementById('gemini-key-input');
        const setupSection = document.getElementById('setup-section');
        const loginBtn = document.getElementById('login-btn');
        const clearCacheBtn = document.getElementById('clear-cache-btn');
        const statusText = document.getElementById('status');
        const timerBadge = document.getElementById('timer');
        
        const tabsContainer = document.getElementById('tabs-container');
        const tabMain = document.getElementById('tab-main');
        const tabAi = document.getElementById('tab-ai');
        const tabSkipped = document.getElementById('tab-skipped');
        const aiBadge = document.getElementById('ai-badge');
        const skippedBadge = document.getElementById('skipped-badge');
        const skippedWarning = document.getElementById('skipped-warning');

        const searchContainer = document.getElementById('search-container');
        const searchInput = document.getElementById('search-input');
        const aiFilterBtn = document.getElementById('ai-filter-btn');
        const resetFilterBtn = document.getElementById('reset-filter-btn');
        const saveTabBtn = document.getElementById('save-tab-btn');
        
        const selectionBar = document.getElementById('selection-bar');
        const selectAllBtn = document.getElementById('select-all-btn');
        const selectNoneBtn = document.getElementById('select-none-btn');
        const viewSelectedBtn = document.getElementById('view-selected-btn');
        const selectionCountText = document.getElementById('selection-count');
        
        const table = document.getElementById('songs-table');
        const tbody = document.getElementById('songs-body');

        // ==========================================
        // MASTER VIEW ENGINE
        // ==========================================
        function updateView() {
            let baseList = allFetchedSongs;
            skippedWarning.classList.add('hidden'); // Hide warning by default

            // 1. Pick the base list depending on the active tab
            if (currentTab === 'ai') {
                baseList = aiFilteredSongs;
            } else if (currentTab === 'skipped') {
                baseList = skippedSongs;
                skippedWarning.classList.remove('hidden'); // Show warning only on this tab
            } else if (currentTab.startsWith('custom-')) {
                const tab = customTabs.find(t => t.id === currentTab);
                if (tab) baseList = tab.songs;
            }

            // 2. Apply text filter if any
            const query = searchInput.value.trim().toLowerCase();
            if (query) {
                baseList = baseList.filter(song =>
                    song.name.toLowerCase().includes(query) || 
                    song.artist.toLowerCase().includes(query) || 
                    song.album.toLowerCase().includes(query)
                );
            }

            // 3. Apply "Selected Only" toggle if active
            if (showingSelectedOnly) {
                baseList = baseList.filter(song => song.selected);
            }

            renderTable(baseList);
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const selectedCount = allFetchedSongs.filter(s => s.selected).length;
            selectionCountText.innerText = `${selectedCount} song${selectedCount !== 1 ? 's' : ''} selected`;
        }

        function mapSongsWithSelection(songs) {
            return songs.map(s => ({ ...s, selected: s.selected || false }));
        }

        // ==========================================
        // TIMER LOGIC
        // ==========================================
        let loadingInterval;
        let startTime;

        function startTimer() {
            timerBadge.classList.remove('hidden');
            timerBadge.innerText = '0.0s';
            startTime = Date.now();
            
            loadingInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                timerBadge.innerText = `${elapsed}s`;
            }, 100);
        }

        function stopTimer() {
            clearInterval(loadingInterval);
            timerBadge.classList.add('hidden');
        }

        function setStatus(message, isError = false) {
            statusText.innerText = message;
            statusText.style.color = isError ? "#ff4444" : "#b3b3b3";
            if (isError) {
                setTimeout(() => { statusText.style.color = "#b3b3b3"; }, 5000);
            }
        }

        // ==========================================
        // PKCE CRYPTOGRAPHIC HELPERS
        // ==========================================
        const generateRandomString = (length) => {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        };

        const sha256 = async (plain) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        };

        const base64encode = (input) => {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        };

        // ==========================================
        // POPUP & AUTHENTICATION HANDLING
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        let code = urlParams.get('code');
        
        if (window.opener && code) {
            window.opener.postMessage({ type: 'spotify-auth-code', code: code }, '*');
            window.close();
        }

        window.addEventListener('message', async (event) => {
            if (event.data && event.data.type === 'spotify-auth-code') {
                setStatus("Authenticating...");
                startTimer();
                await exchangeToken(event.data.code);
            }
        });

        loginBtn.addEventListener('click', async () => {
            const clientId = clientIdInput.value.trim();
            const geminiKey = geminiKeyInput.value.trim();
            
            if (!clientId) {
                alert("Please enter a valid Spotify Client ID.");
                return;
            }

            localStorage.setItem(CLIENT_ID_KEY, clientId);
            if (geminiKey) localStorage.setItem(GEMINI_KEY_KEY, geminiKey);

            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier); 
            
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const authUrl = new URL("https://accounts.spotify.com/authorize");
            authUrl.search = new URLSearchParams({
                client_id: clientId,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                scope: SCOPES,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
            }).toString();
            
            const width = 450, height = 600;
            const left = (screen.width / 2) - (width / 2);
            const top = (screen.height / 2) - (height / 2);
            
            window.open(authUrl.toString(), 'Spotify Login', `width=${width},height=${height},top=${top},left=${left}`);
        });

        async function exchangeToken(authCode) {
            const codeVerifier = localStorage.getItem('code_verifier');
            const clientId = localStorage.getItem(CLIENT_ID_KEY);

            const payload = {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: authCode,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier,
                }),
            };

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', payload);
                if (!response.ok) throw new Error('Token exchange failed');
                
                const data = await response.json();
                accessToken = data.access_token;
                
                localStorage.removeItem('code_verifier');
                setupSection.classList.add('hidden');
                clearCacheBtn.classList.remove('hidden');
                
                initApp();
            } catch (error) {
                console.error(error);
                stopTimer();
                setStatus("Authentication failed. Please check your Client ID and try again.", true);
            }
        }

        // ==========================================
        // CORE LOGIC & DATA FETCHING
        // ==========================================
        async function initApp() {
            if (geminiKeyInput.value) {
                localStorage.setItem(GEMINI_KEY_KEY, geminiKeyInput.value.trim());
            }

            const cachedSongs = localStorage.getItem(CACHE_KEY);
            
            if (cachedSongs) {
                stopTimer(); 
                setStatus("Loaded from cache.");
                allFetchedSongs = mapSongsWithSelection(JSON.parse(cachedSongs)); 
                renderTable(allFetchedSongs);
            } else if (accessToken) {
                if(timerBadge.classList.contains('hidden')) startTimer();
                
                setStatus("Fetching songs from Spotify... This might take a moment.");
                const songs = await fetchAllLikedSongs();
                
                stopTimer();
                
                if (songs.length > 0) {
                    allFetchedSongs = mapSongsWithSelection(songs);
                    localStorage.setItem(CACHE_KEY, JSON.stringify(allFetchedSongs));
                    setStatus(`Fetched ${allFetchedSongs.length} songs. Saved to cache.`);
                    renderTable(allFetchedSongs);
                }
            }
            
            if (allFetchedSongs.length > 0) {
                searchContainer.classList.remove('hidden');
                selectionBar.classList.remove('hidden');
                tabsContainer.classList.remove('hidden');
                updateView(); 
            }
        }

        async function fetchAllLikedSongs() {
            let allSongs = [];
            let nextUrl = 'https://api.spotify.com/v1/me/tracks?limit=50'; 
            let count = 0;

            try {
                while (nextUrl) {
                    const response = await fetch(nextUrl, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });

                    if (!response.ok) throw new Error('Failed to fetch from Spotify');

                    const data = await response.json();
                    
                    const formattedSongs = data.items.map(item => ({
                        id: item.track.id,
                        added_at: item.added_at,
                        name: item.track.name,
                        artist: item.track.artists.map(a => a.name).join(', '),
                        album: item.track.album.name,
                        image: item.track.album.images[2]?.url || '',
                        selected: false
                    }));

                    allSongs = allSongs.concat(formattedSongs);
                    nextUrl = data.next; 
                    count += formattedSongs.length;
                    setStatus(`Fetching... (${count} retrieved)`);
                }
                return allSongs;
            } catch (error) {
                console.error(error);
                setStatus("Error fetching songs. Token may have expired.", true);
                return [];
            }
        }

        // ==========================================
        // SELECTION LOGIC & TABS
        // ==========================================
        tbody.addEventListener('change', (event) => {
            if (event.target.classList.contains('song-checkbox')) {
                const songId = event.target.getAttribute('data-id');
                const isChecked = event.target.checked;
                
                const song = allFetchedSongs.find(s => s.id === songId);
                if (song) song.selected = isChecked;
                
                updateSelectionCount();
            }
        });

        selectAllBtn.addEventListener('click', () => {
            currentlyDisplayedSongs.forEach(song => {
                const masterSong = allFetchedSongs.find(s => s.id === song.id);
                if (masterSong) masterSong.selected = true;
            });
            updateView(); 
        });

        selectNoneBtn.addEventListener('click', () => {
            allFetchedSongs.forEach(song => song.selected = false);
            updateView(); 
        });

        viewSelectedBtn.addEventListener('click', () => {
            showingSelectedOnly = !showingSelectedOnly;
            if (showingSelectedOnly) {
                viewSelectedBtn.classList.add('active');
                viewSelectedBtn.innerText = "Showing Selected Only";
            } else {
                viewSelectedBtn.classList.remove('active');
                viewSelectedBtn.innerText = "Show Selected Only";
            }
            updateView();
        });

        // Tab Management System
        function switchTab(tabId) {
            currentTab = tabId;
            
           // Update UI active states
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.id === `tab-${tabId}` || 
                   (tabId === 'main' && btn.id === 'tab-main') || 
                   (tabId === 'ai' && btn.id === 'tab-ai') || 
                   (tabId === 'skipped' && btn.id === 'tab-skipped')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Clear text search when swapping tabs for a fresh view
            searchInput.value = ''; 
            updateView();
        }

        function closeCustomTab(tabId) {
            customTabs = customTabs.filter(t => t.id !== tabId);
            const btn = document.getElementById(`tab-${tabId}`);
            if (btn) btn.remove();
            
            if (currentTab === tabId) {
                switchTab('main'); // Revert to main if closing active tab
            }
        }

        tabMain.addEventListener('click', () => switchTab('main'));
        tabAi.addEventListener('click', () => switchTab('ai'));
        tabSkipped.addEventListener('click', () => switchTab('skipped'));

        saveTabBtn.addEventListener('click', () => {
            if (currentlyDisplayedSongs.length === 0) {
                alert("There are no songs currently displayed to save.");
                return;
            }
            
            customTabCounter++;
            const tabId = `custom-${customTabCounter}`;
            let tabName = searchInput.value.trim();
            
            // Auto-generate a name if the search bar is empty
            if (!tabName) {
                if (currentTab === 'ai') tabName = 'AI Results (Saved)';
                else if (showingSelectedOnly) tabName = 'Selected Songs';
                else tabName = `Saved View ${customTabCounter}`;
            }

            // Snapshot the currently displayed list
            const newTab = {
                id: tabId,
                name: tabName,
                songs: [...currentlyDisplayedSongs] 
            };
            customTabs.push(newTab);

            // Create tab button HTML
            const tabBtn = document.createElement('button');
            tabBtn.className = 'tab-btn';
            tabBtn.id = `tab-${tabId}`;
            tabBtn.innerHTML = `${tabName} <span style="font-size: 0.8em; color: #888;">(${newTab.songs.length})</span> <span class="close-tab-btn" data-id="${tabId}">✖</span>`;
            
            // Listeners for clicking the tab or the 'X' button
            tabBtn.addEventListener('click', (e) => {
                if (e.target.classList.contains('close-tab-btn')) {
                    e.stopPropagation();
                    closeCustomTab(e.target.getAttribute('data-id'));
                    return;
                }
                switchTab(tabId);
            });

            tabsContainer.appendChild(tabBtn);
            switchTab(tabId);
            setStatus(`Created new tab: ${tabName}`);
        });

        // ==========================================
        // FILTERING: STANDARD & AI
        // ==========================================
        searchInput.addEventListener('input', updateView);

        aiFilterBtn.addEventListener('click', async () => {
            const query = searchInput.value.trim();
            const geminiKey = localStorage.getItem(GEMINI_KEY_KEY) || geminiKeyInput.value.trim();
            const selectedSongs = allFetchedSongs.filter(s => s.selected);

            if (selectedSongs.length === 0) {
                alert("Please select at least one song using the checkboxes before filtering with AI.\n\nTip: Click 'Select All' to search your entire visible library.");
                return;
            }
            if (!query) {
                alert("Please enter a query in the search box first.");
                return;
            }
            if (!geminiKey) {
                alert("Please enter a Gemini API Key.");
                return;
            }

            aiFilterBtn.disabled = true;
            aiFilterBtn.innerText = "Thinking...";
            setStatus(`Sending ${selectedSongs.length} selected songs to Gemini AI... Please wait.`);
            startTimer();

            try {
                // === NEW LIMIT LOGIC ===
                const MAX_SONGS_PER_CHUNK = 500;
                const MAX_CHUNKS = 5;
                const TOTAL_LIMIT = MAX_SONGS_PER_CHUNK * MAX_CHUNKS; // 2500 max songs

                let songsToProcess = selectedSongs;
                skippedSongs = []; // Clear previous skips

                // Slice the array if it exceeds the limit
                if (selectedSongs.length > TOTAL_LIMIT) {
                    songsToProcess = selectedSongs.slice(0, TOTAL_LIMIT);
                    skippedSongs = selectedSongs.slice(TOTAL_LIMIT);
                }

                const minimizedSongs = songsToProcess.map(s => ({
                    id: s.id,
                    name: s.name,
                    artist: s.artist,
                    album: s.album
                }));

                const chunks = [];
                for (let i = 0; i < minimizedSongs.length; i += MAX_SONGS_PER_CHUNK) {
                    chunks.push(minimizedSongs.slice(i, i + MAX_SONGS_PER_CHUNK));
                }

                const fetchPromises = chunks.map(async (chunk, index) => {
                    const prompt = `You are a music librarian API. I will provide a JSON array of songs in a user's library.
                    The user has requested to filter this library based on the following criteria: "${query}".
                    Your task: Return a raw JSON array of ONLY the string IDs of the songs that match or fit the vibe of this criteria. 
                    Do not include markdown blocks like \`\`\`json. Return ONLY the raw array [ "id1", "id2" ].
                    Song Library:
                    ${JSON.stringify(chunk)}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { 
                                temperature: 0.1,
                                maxOutputTokens: 8192,
                                responseMimeType: "application/json" // Forces strict JSON generation
                            } 
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `Chunk ${index + 1} failed.`);
                    }

                    const data = await response.json();
                    const resultText = data.candidates[0].content.parts[0].text;
                    
                    // Defensive Parsing: Extract all complete alphanumeric strings wrapped in quotes.
                    // This bypasses JSON.parse() crashes completely. If the AI cuts off like `"id3`, it is safely ignored.
                    const matches = resultText.match(/"([a-zA-Z0-9]+)"/g);
                    const matchingIds = matches ? matches.map(id => id.replace(/"/g, '')) : [];
                    
                    return matchingIds;
                });

                const resultsArray = await Promise.all(fetchPromises);
                const allMatchingIds = resultsArray.flat();

                // Match against the songs we ACTUALLY processed
                const filteredSongs = songsToProcess.filter(song => allMatchingIds.includes(song.id));
                
                aiFilteredSongs = filteredSongs;
                tabAi.classList.remove('hidden');
                aiBadge.innerText = `(${filteredSongs.length})`;

                // Handle Skipped Songs Tab UI
                if (skippedSongs.length > 0) {
                    tabSkipped.classList.remove('hidden');
                    skippedBadge.innerText = `(${skippedSongs.length})`;
                } else {
                    tabSkipped.classList.add('hidden');
                }

                switchTab('ai'); 
                
                if (skippedSongs.length > 0) {
                    setStatus(`Gemini found ${filteredSongs.length} matches. ${skippedSongs.length} songs were skipped due to limits.`);
                } else {
                    setStatus(`Gemini found ${filteredSongs.length} matches out of the ${songsToProcess.length} songs you selected.`);
                }

            } catch (error) {
                console.error("Full caught error:", error);
                setStatus(`AI Filter Failed - ${error.message}`, true);
            } finally {
                stopTimer();
                aiFilterBtn.disabled = false;
                aiFilterBtn.innerText = "Filter with AI";
            }
        });

        resetFilterBtn.addEventListener('click', () => {
            searchInput.value = '';
            showingSelectedOnly = false;
            viewSelectedBtn.classList.remove('active');
            viewSelectedBtn.innerText = "Show Selected Only";
            updateView();
            setStatus("Filters reset.");
        });

        // ==========================================
        // UI RENDERING
        // ==========================================
        function renderTable(songs) {
            currentlyDisplayedSongs = songs; 
            tbody.innerHTML = ''; 
            
            songs.forEach((song, index) => {
                const dateAdded = new Date(song.added_at).toLocaleDateString();
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>
                        <input type="checkbox" class="song-checkbox" data-id="${song.id}" ${song.selected ? 'checked' : ''}>
                    </td>
                    <td>${index + 1}</td>
                    <td>
                        <img src="${song.image}" class="album-art" alt="Album art">
                        <div style="display:inline-block; vertical-align:middle;">
                            <div style="font-weight:bold; color:white;">${song.name}</div>
                            <div style="color:#b3b3b3; font-size:0.85em; margin-top:4px;">${song.artist}</div>
                        </div>
                    </td>
                    <td>${song.album}</td>
                    <td>${dateAdded}</td>
                `;
                tbody.appendChild(tr);
            });
            
            table.classList.remove('hidden');
        }

        clearCacheBtn.addEventListener('click', () => {
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(CLIENT_ID_KEY);
            localStorage.removeItem(GEMINI_KEY_KEY);
            accessToken = null;
            allFetchedSongs = [];
            currentlyDisplayedSongs = [];
            aiFilteredSongs = [];
            skippedSongs = [];
            customTabs = [];
            customTabCounter = 0;
            
            // Remove dynamically generated custom tabs from the UI
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.id !== 'tab-main' && btn.id !== 'tab-ai') btn.remove();
            });
            
            switchTab('main');
            tabAi.classList.add('hidden'); // Hide AI tab on full reset
            tabSkipped.classList.add('hidden');
            
            tbody.innerHTML = '';
            table.classList.add('hidden');
            searchContainer.classList.add('hidden');
            selectionBar.classList.add('hidden');
            tabsContainer.classList.add('hidden');
            searchInput.value = ''; 
            setupSection.classList.remove('hidden');
            clearCacheBtn.classList.add('hidden');
            clientIdInput.value = '';
            geminiKeyInput.value = '';
            
            stopTimer();
            setStatus("Cache and credentials cleared. Please enter credentials to start over.");
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedClientId = localStorage.getItem(CLIENT_ID_KEY);
            const savedGeminiKey = localStorage.getItem(GEMINI_KEY_KEY);
            
            if (savedClientId) clientIdInput.value = savedClientId;
            if (savedGeminiKey) geminiKeyInput.value = savedGeminiKey;

            if (localStorage.getItem(CACHE_KEY)) {
                setupSection.classList.add('hidden');
                clearCacheBtn.classList.remove('hidden');
                initApp();
            }
        });
    </script>
</body>
</html>
